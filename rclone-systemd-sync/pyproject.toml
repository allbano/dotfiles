[project]
name = "rclone-systemd-sync"
version = "0.0.1"
description = "Pacote para gerenciar perfis e pastas do Cloud Drives (sync)"
authors = [
    {name = "Albano Maywitz",email = "allbano@gmail.com"}
]
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "typer (>=0.25.1,<0.26.0)",
    "rich (>=15.0.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]
