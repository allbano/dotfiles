# -*- mode: conf -*-

# ==========================================
# IMPORTAÇÃO DE TEMAS
# ==========================================
# Se você tiver configurações de cores no arquivo 'default', ele deve ser importado aqui.
# Certifique-se de que o arquivo 'default' usa [colors-dark] internamente.
include=/home/albano/.config/foot/default

# ==========================================
# CONFIGURAÇÕES GERAIS (MAIN)
# ==========================================
[main]
# term=foot (or xterm-256color if built with -Dterminfo=disabled)
# app-id=foot 
# title=foot
# locked-title=no

# font=CaskaydiaCove Nerd Font:size=12
font=RecMonoCasual Nerd Font:size=12

# initial-window-size-pixels=700x500
initial-window-mode=maximized

shell=bash -c "tmux -L tx-foot new-session -A"

# workers=<number of logical CPUs>

# ==========================================
# AMBIENTE & SEGURANÇA
# ==========================================
[environment]
# name=value

[security]
# osc52=enabled

# ==========================================
# COMPORTAMENTO (BELL, SCROLL, MOUSE)
# ==========================================
[bell]
system=no
notify=no

[desktop-notifications]
# inhibit-when-focused=yes

[scrollback]
# lines=1000

[mouse]
# hide-when-typing=no
# alternate-scroll-mode=yes

[touch]
# long-press-delay=400

# ==========================================
# VISUAL (CURSOR, CSD)
# ==========================================
[cursor]
# style=block
# blink=no

[csd]
# preferred=server
preferred=none

# ==========================================
# CORES E TEMAS
# ==========================================
# Caso você queira definir as cores diretamente aqui (em vez de no arquivo 'default'),
# descomente e edite a seção abaixo. NUNCA use [colors], apenas [colors-dark] ou [colors-light].

[colors-dark]
alpha=0.8
# background=242424
# foreground=ffffff

## Se você precisar configurar cursor, seleção ou URLs com cores específicas, faça aqui:
# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
# urls=<regular3>

# [colors2] foi depreciado/substituído pela lógica dark/light, mas caso precise:
# [colors2]
# dim-blend-towards=white

# ==========================================
# TECLAS DE ATALHO (BINDINGS)
# ==========================================
[key-bindings]
# clipboard-copy=Control+Shift+c XF86Copy
# clipboard-paste=Control+Shift+v XF86Paste
# primary-paste=Shift+Insert
# search-start=Control+Shift+r
# font-increase=Control+plus Control+equal Control+KP_Add
# font-decrease=Control+minus Control+KP_Subtract
# font-reset=Control+0 Control+KP_0
# spawn-terminal=Control+Shift+n

[search-bindings]
# cancel=Control+g Control+c Escape
# commit=Return KP_Enter
# find-prev=Control+r
# find-next=Control+s

[url-bindings]
# cancel=Control+g Control+c Control+d Escape
# toggle-url-visible=t

[text-bindings]
# \x03=Mod4+c  # Map Super+c -> Ctrl+c

[mouse-bindings]
# primary-paste=BTN_MIDDLE

# vim: ft=dosini
